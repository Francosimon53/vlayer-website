# Final validation after lint warning cleanup
name: Validate audit exception reduction

on:
  push:
    branches: [chore/reduce-audit-exceptions]
    paths:
      - '.github/workflows/quality-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Run vlayer scan
        run: |
          npx --yes verification-layer@latest scan . --config vlayer.config.json --no-ai -f json -o vlayer-quality.json || true
          jq '.stats' vlayer-quality.json
          BLOCKING=$(jq '[.findings[] | select((.severity == "critical" or .severity == "high") and (.acknowledged != true))] | length' vlayer-quality.json)
          ACK=$(jq '[.findings[] | select(.acknowledged == true)] | length' vlayer-quality.json)
          echo "blocking=$BLOCKING acknowledged=$ACK"
          test "$BLOCKING" -eq 0
